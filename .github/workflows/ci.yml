name: CI

# Nur auf PRs — GitHub testet beim pull_request-Event bereits den Merge-Commit
# (main + Branch). Ein separater push:[main]-Lauf wäre redundant.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Fail if PR adds more than 400 lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ADDED=$(git diff "origin/$BASE_REF"...HEAD \
            -- . ':(exclude)*.lock' ':(exclude)*-lock.json' \
               ':(exclude)*.md' ':(exclude)LICENSE' \
               ':(exclude)*/tests/*' ':(exclude)*/test_*.py' \
            | grep -cE '^\+[^+]' || echo 0)
          echo "Lines added (excl. lockfiles + docs + tests): $ADDED"
          if [ "$ADDED" -gt 400 ]; then
            echo "::error::PR zu groß (${ADDED} Zeilen, Limit: 400) — bitte aufteilen."
            exit 1
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: check .
          version: "0.11.4"
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: format --check .
          version: "0.11.4"

  security:
    name: Security
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: pip-audit
        run: |
          uv export --frozen --no-hashes -o /tmp/requirements.txt
          pip install pip-audit==2.8.0
          pip-audit -r /tmp/requirements.txt
      - name: bandit
        run: |
          uv sync --frozen --extra dev
          uv run bandit -r src/ cli/ -q -x tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run mypy src/ cli/ --ignore-missing-imports --explicit-package-bases

  test:
    name: Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/ -v --cov=src --cov=cli --cov-fail-under=0

  ci-ok:
    name: CI OK (All Green Gate)
    runs-on: ubuntu-latest
    if: always()
    needs: [check-pr-size, lint, security, typecheck, test]
    steps:
      - name: All checks passed
        run: |
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"failure"|"cancelled"'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."
